name: Deploy Decaigny Backend

on:
  push:
    branches:
      - iflair_development
    paths:
      - '**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

concurrency:
  group: decaigny-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is missing}"
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is missing}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS secret is missing}"

          # Write the key while removing Windows CRLF characters.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          # Install the independently verified server host key.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "===== VALIDATE PRIVATE KEY ====="
          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null; then
            echo "The DEPLOY_SSH_KEY secret is not a valid private SSH key."
            exit 1
          fi
          echo "Private SSH key is valid."

          echo "===== VERIFY SERVER HOST KEY ENTRY ====="
          if ! ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null; then
            echo "No known_hosts entry matches DEPLOY_HOST."
            echo "Check that the entry hostname/IP exactly matches the secret."
            exit 1
          fi
          echo "Server host-key entry found."

      - name: Test SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_USER:?DEPLOY_USER secret is missing}"
          : "${DEPLOY_PORT:?DEPLOY_PORT secret is missing}"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu; printf "SSH authentication successful\n"; id'

      - name: Deploy backend on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu

             echo "===== CHECK BACKEND DIRECTORY ====="
             cd /project/backend

             echo "===== CHECK CURRENT SOURCE STATUS ====="
             git status --short

             echo "===== FETCH LATEST BACKEND BRANCH ====="
             git fetch origin iflair_development

             echo "===== TARGET COMMIT ====="
             git log -1 --oneline origin/iflair_development

             echo "===== UPDATE BACKEND SOURCE ====="
             git reset --hard origin/iflair_development

             echo "===== BUILD BACKEND IMAGE ====="
             cd /project/deployment
             docker compose build backend

             echo "===== RECREATE BACKEND ONLY ====="
             docker compose up -d --no-deps backend

             echo "===== WAIT FOR BACKEND STARTUP ====="
             sleep 5

             echo "===== BACKEND CONTAINER STATUS ====="
             docker compose ps backend

             echo "===== BACKEND LOGS ====="
             docker compose logs --tail=60 backend

             echo "===== VERIFY PUBLIC API DOCS ====="
             curl --fail --silent --show-error \
               --retry 5 \
               --retry-delay 3 \
               --retry-connrefused \
               https://api.decaigny.be/docs \
               -o /dev/null

             echo "Backend deployment and public API docs check completed successfully."
            '
